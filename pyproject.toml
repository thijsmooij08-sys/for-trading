[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polytrader-nextgen"
version = "0.1.0"
description = "Alpaca-first, paper-only trading platform with deterministic risk authority."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "thijsmooij08-sys" }]
dependencies = []

[project.optional-dependencies]
core = [
    "alembic==1.20.0",
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "psycopg[binary]==3.3.6",
    "SQLAlchemy==2.1.3",
]
alpaca = ["alpaca-py==0.44.0"]
simulation = ["nautilus-trader==1.231.0"]
research = [
    "duckdb==1.5.6",
    "mlflow==3.17.0",
    "optuna==5.0.0",
    "pyarrow==25.0.1",
]
dev = [
    "hypothesis==6.168.5",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.setuptools]
package-dir = { "" = "backend/src" }

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend/src"
strict = true
warn_unused_configs = true
